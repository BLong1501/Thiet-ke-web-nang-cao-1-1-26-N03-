version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: crowdfunding_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crowdfunding_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # phpMyAdmin (Quản lý Database trực quan)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: crowdfunding_phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql

  # Redis (Lưu trữ Session & Caching)
  redis:
    image: redis:7.0-alpine
    container_name: crowdfunding_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # MinIO (Lưu trữ file tương thích AWS S3)
  minio:
    image: minio/minio:latest
    container_name: crowdfunding_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # Cổng gọi API
      - "9001:9001"  # Cổng vào giao diện Console UI
    volumes:
      - minio_data:/data
    restart: always

volumes:
  mysql_data:
  redis_data:
  minio_data:
