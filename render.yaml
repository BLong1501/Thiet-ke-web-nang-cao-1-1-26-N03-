services:
  # ==========================================
  # 1. BACKEND WEB SERVICE (Express / Node.js)
  # ==========================================
  - type: web
    name: crowdfunding-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: crowdfunding-frontend
          property: host
      - key: JWT_SECRET
        value: super_secret_jwt_key_crowdfunding_cd09_development_2026
      - key: JWT_REFRESH_SECRET
        value: super_refresh_jwt_key_crowdfunding_cd09_development_2026
      - key: COOKIE_SECRET
        value: session_cookie_secret_long_secure_string_here_123456
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

  # ==========================================
  # 2. FRONTEND STATIC SITE (React / Vite)
  # ==========================================
  - type: web
    name: crowdfunding-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Hỗ trợ Client-side Routing (React Router) khi F5 không bị lỗi 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://crowdfunding-backend-ad19.onrender.com/api/v1
