    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      nhờ vậy không bị trùng lặp thẻ description/og.
    -->
    <meta
      data-rh="true"
      name="description"
      content="FundTrust — Kết nối lòng tốt. Khám phá chiến dịch, đóng góp và theo dõi việc sử dụng quỹ minh bạch."

      content="gây quỹ, crowdfunding, quyên góp, chiến dịch, cộng đồng"
    />
    <meta
      data-rh="true"
      property="og:title"
      content="FundTrust — Kết nối lòng tốt"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Khám phá chiến dịch, đóng góp và theo dõi việc sử dụng quỹ minh bạch."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <title>FundTrust — Kết nối lòng tốt</title>
  </head>
